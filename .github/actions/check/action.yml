name: Addon checks
description: Lint and execute the addon tests using native Lua 5.1
runs:
  using: composite
  steps:
    - shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
    - uses: nebularg/actions-luacheck@v1
      with:
        args: '--no-color -q FriendlyNameplateGuild.lua Options.lua'
    - shell: bash
      run: |
        {
          lua5.1 .github/tests/test.lua
          bash .github/tests/update.sh
        } 2>&1 | tee test-results.txt
