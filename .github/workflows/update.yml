name: Forever update
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      check_current:
        description: Run checks even if the live build is unchanged
        type: boolean
        default: false
  repository_dispatch:
    types: [wow-updated]
permissions:
  contents: write
  issues: write
concurrency:
  group: forever-update
  cancel-in-progress: false
jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Detect the live Forever build
        id: detect
        env:
          INTERFACE_FEED: ${{ vars.FOREVER_BUILD_FEED_URL }}
        run: bash .github/check-wow.sh detect
      - name: Stage the candidate version
        id: stage
        if: steps.detect.outputs.changed == 'true'
        run: bash .github/check-wow.sh stage
      - name: Check the candidate
        id: checks
        if: always() && (steps.detect.outputs.changed == 'true' || inputs.check_current == true)
        uses: ./.github/actions/check
      - name: Commit and tag a passing update
        if: success() && steps.checks.outcome == 'success' && steps.stage.outputs.tag != ''
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ steps.stage.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FriendlyNameplateGuild.toc .github/wow-version.json
          git commit -m "chore: tested Forever update $TAG"
          git tag "$TAG"
          git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/$TAG"
      # GITHUB_TOKEN tag pushes do not trigger another workflow, so package here.
      - name: Package and release the passing update
        if: success() && steps.checks.outcome == 'success' && steps.stage.outputs.tag != ''
        uses: BigWigsMods/packager@v2
        with:
          args: '-g forever'
          pandoc: 'false'
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      - name: Save failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: update-failure
          path: |
            candidate.json
            test-results.txt
          if-no-files-found: ignore
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FNG_BUILD: ${{ steps.detect.outputs.build }}
        run: bash .github/report-failure.sh
