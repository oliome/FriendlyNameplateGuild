name: Forever compatibility
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      check_current:
        description: Run tests even if the live build has not changed
        type: boolean
        default: false
  repository_dispatch:
    types: [wow-updated]
permissions:
  contents: write
  issues: write
concurrency:
  group: forever-compatibility
  cancel-in-progress: false
jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Detect the official live Forever build
        id: detect
        env:
          INTERFACE_FEED: ${{ vars.FOREVER_BUILD_FEED_URL }}
        shell: bash
        run: |
          if [ -n "$INTERFACE_FEED" ]; then
            python tools/compatibility.py --detect --feed "$INTERFACE_FEED"
          else
            python tools/compatibility.py --detect
          fi
      - name: Install test dependencies
        id: dependencies
        if: steps.detect.outputs.changed == 'true' || inputs.check_current == true
        run: python -m pip install -r requirements-dev.txt
      - name: Stage the candidate version
        id: stage
        if: steps.detect.outputs.changed == 'true'
        run: python tools/compatibility.py --observation candidate.json
      - name: Test the candidate
        id: tests
        if: always() && steps.dependencies.outcome == 'success' && (steps.detect.outputs.changed == 'true' || inputs.check_current == true)
        shell: bash
        run: python -m unittest discover -s tests -v 2>&1 | tee test-results.txt
      - name: Package only a passing candidate
        id: package
        if: success() && steps.stage.outcome == 'success' && steps.tests.outcome == 'success'
        shell: bash
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          from tools.compatibility import ROOT, package
          state = json.loads(Path('compatibility.json').read_text())
          preview = state.get('runtime_ready') is not True
          archive = package(ROOT, ROOT / 'dist', preview=preview)
          # Keep the player-facing download link current without README edits.
          target = 'FriendlyNameplateGuild.zip'
          shutil.copyfile(archive, Path('downloads') / target)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('version=' + state['addon_version'], file=output)
              print('archive=' + str(archive.relative_to(ROOT)), file=output)
              print('preview=' + str(preview).lower(), file=output)
          PY
      - name: Commit and tag the tested update
        id: publish
        if: success() && steps.package.outcome == 'success'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ steps.package.outputs.version }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add compatibility.json addon/FriendlyNameplateGuild/FriendlyNameplateGuild.toc downloads/FriendlyNameplateGuild.zip
          git commit -m "chore: tested Forever compatibility v$VERSION"
          git tag "v$VERSION"
          git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/v$VERSION"
      - name: Publish the tested package
        if: success() && steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          PREVIEW: ${{ steps.package.outputs.preview }}
        shell: bash
        run: |
          FLAGS=()
          if [ "$PREVIEW" = true ]; then FLAGS+=(--prerelease); fi
          gh release create "v$VERSION" "$ARCHIVE" --verify-tag "${FLAGS[@]}" --title "FriendlyNameplateGuild $VERSION" --notes 'Automatic update for a newer live Forever build. Candidate tests passed. CI did not launch the WoW client; preview status is retained until in-game validation.'
      - name: Retain failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-failure
          path: |
            candidate.json
            test-results.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Open a deduplicated issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          FNG_BUILD: ${{ steps.detect.outputs.build }}
        run: python tools/report_failure.py
